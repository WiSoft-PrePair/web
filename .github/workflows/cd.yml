name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cd-web-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5

      - name: pnpm 설치 (package.json의 packageManager 버전)
        uses: pnpm/action-setup@v4

      - name: Node 22 설치
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 실패하면 여기서 멈추고 배포하지 않는다
      - name: Lint
        run: pnpm lint

      - name: 빌드 (타입 체크 포함)
        run: pnpm build

      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 해시가 붙은 빌드 파일: 이름이 바뀌므로 오래 캐시
      - name: 정적 자산 업로드 (assets/)
        run: |
          aws s3 sync dist/assets/ "s3://${{ vars.S3_BUCKET }}/assets/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      # public/ 에서 온 파일(favicon 등): 이름이 그대로라 짧게 캐시
      - name: 그 밖의 파일 업로드
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=3600"

      - name: index.html 업로드
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      # 와일드카드도 경로 1개로 계산된다 (월 1,000개까지 무료)
      - name: CloudFront 캐시 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
